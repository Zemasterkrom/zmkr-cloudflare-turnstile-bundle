name: 🐛 Bug Report
description: Report a bug with this bundle
labels: bug

body:
  - type: input
    id: php-versions
    attributes:
      label: PHP version(s)
      placeholder: x.y.z
    validations:
      required: true
  - type: input
    id: symfony-versions
    attributes:
      label: Symfony version(s)
      placeholder: x.y.z
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Description of the issue, including what you expected to happen and what actually happened.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: Describe the steps to reproduce the issue.
    validations:
      required: true
